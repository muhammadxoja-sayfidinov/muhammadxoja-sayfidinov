  <text x="72" y="166" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="700" letter-spacing="-.8">Muhammad Xoja Sayfidinov</text>
  <text x="76" y="207" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Mobile products · Backend systems · Practical software</text>
  <rect x="76" y="244" width="295" height="38" rx="19" fill="#111d32" stroke="#52627d" stroke-opacity=".65"/>
  <circle cx="97" cy="263" r="5" fill="#38bdf8"/><text x="111" y="269" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">FLUTTER</text>
  <circle cx="199" cy="263" r="5" fill="#a78bfa"/><text x="213" y="269" fill="#ede9fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">DART</text>
  <circle cx="279" cy="263" r="5" fill="#4ade80"/><text x="293" y="269" fill="#dcfce7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">PYTHON</text>
