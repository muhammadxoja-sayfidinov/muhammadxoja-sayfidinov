    <text x="24" y="82" fill="#94a3b8" font-family="Consolas,monospace" font-size="13">class</text>
    <text x="65" y="82" fill="#7dd3fc" font-family="Consolas,monospace" font-size="13">ProductBuilder:</text>
    <text x="42" y="111" fill="#c4b5fd" font-family="Consolas,monospace" font-size="13">def</text>
    <text x="73" y="111" fill="#f8fafc" font-family="Consolas,monospace" font-size="13">build(self):</text>
    <text x="60" y="140" fill="#86efac" font-family="Consolas,monospace" font-size="13">return useful_software</text>
